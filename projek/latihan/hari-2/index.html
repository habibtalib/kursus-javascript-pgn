<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Latihan Hari 2 — JS PGN</title>
    <style>
      :root { color-scheme: light dark; --latar: #fafaf7; --teks: #1d2433; --garis: #d8dbe2; --aksen: #0b6e4f; --ralat: #b3261e; }
      @media (prefers-color-scheme: dark) { :root { --latar: #14171c; --teks: #e6e8eb; --garis: #2c313a; --aksen: #4cc39a; --ralat: #ff8a80; } }
      body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: var(--latar); color: var(--teks); }
      h1 { font-size: 1.25rem; margin: 0 0 4px; }
      nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
      nav a { padding: 6px 10px; border: 1px solid var(--garis); border-radius: 6px; color: inherit; text-decoration: none; }
      nav a[aria-current='page'] { border-color: var(--aksen); color: var(--aksen); font-weight: 600; }
      pre { padding: 12px; border: 1px solid var(--garis); border-radius: 6px; overflow-x: auto; min-height: 6rem; white-space: pre-wrap; }
      .ralat { color: var(--ralat); }
      small { opacity: 0.75; }
    </style>
  </head>
  <body>
    <h1>Latihan Hari 2 — Asynchronous JavaScript &amp; Web API Integration</h1>
    <small>Output dipapar di bawah <b>dan</b> dalam DevTools → Console (F12). Buka melalui pelayan (Live Server / <code>npx serve</code>), bukan <code>file://</code>.</small>
    <p id="status-api">Mock API: menyemak…</p>
    <nav id="menu"></nav>
    <pre id="output">Pilih satu latihan di atas. Buka juga DevTools → Network untuk melihat setiap permintaan.</pre>

    <script type="module">
      const LATIHAN = [
        ['01', 'S1 · Event loop'],
        ['02', 'S1 · Callback & callback hell'],
        ['03', 'S2 · Cipta & rantai Promise'],
        ['04', 'S2 · fetch GET, status, header'],
        ['05', 'S2 · all / allSettled / race / any'],
        ['06', 'S3 · async/await & jenis ralat'],
        ['07', 'S4 · POST/PATCH/DELETE & Abort'],
        ['08', 'S4 · services/api.js'],
        ['09', '⭐ Retry + backoff'],
        ['10', '⭐ API awam data.gov.my'],
      ];

      // Penunjuk status mock API (textContent — selamat)
      const statusApi = document.getElementById('status-api');
      fetch('http://localhost:3000/api/kesihatan', { signal: AbortSignal.timeout(2000) })
        .then((res) => res.json())
        .then((d) => { statusApi.textContent = `🟢 Mock API hidup (masa pelayan: ${d.masa})`; })
        .catch(() => { statusApi.textContent = '🔴 Mock API TIDAK berjalan — terminal lain: cd projek/api && npm start'; });

      const params = new URLSearchParams(location.search);
      const pilihan = params.get('latihan');
      const kotakOutput = document.getElementById('output');

      // Bina menu dengan createElement + textContent (tiada innerHTML)
      const menu = document.getElementById('menu');
      for (const [nombor, tajuk] of LATIHAN) {
        const pautan = document.createElement('a');
        pautan.href = `?latihan=${nombor}`;
        pautan.textContent = `${nombor} — ${tajuk}`;
        if (nombor === pilihan) pautan.setAttribute('aria-current', 'page');
        menu.append(pautan);
      }

      // Cerminkan console.log/warn/error ke <pre> (textContent — selamat)
      const format = (x) => {
        if (typeof x === 'string') return x;
        if (x instanceof Error) return `${x.name}: ${x.message}`;
        try { return JSON.stringify(x, null, 2) ?? String(x); } catch { return String(x); }
      };
      const tulis = (kelas, args) => {
        const baris = document.createElement('div');
        if (kelas) baris.className = kelas;
        baris.textContent = args.map(format).join(' ');
        kotakOutput.append(baris);
      };
      for (const jenis of ['log', 'info', 'warn', 'error']) {
        const asal = console[jenis].bind(console);
        console[jenis] = (...args) => { asal(...args); tulis(jenis === 'error' ? 'ralat' : '', args); };
      }
      window.addEventListener('error', (e) => tulis('ralat', [`❌ ${e.message}`]));
      window.addEventListener('unhandledrejection', (e) => tulis('ralat', ['❌ Promise ditolak:', e.reason]));

      if (pilihan) {
        kotakOutput.textContent = '';
        const laluan = `./latihan-${pilihan}.js`;
        document.title = `Latihan ${pilihan} — Hari 2`;
        try {
          await import(laluan);
        } catch (ralat) {
          tulis('ralat', [`❌ Gagal memuatkan ${laluan}:`, ralat]);
        }
      }
    </script>
  </body>
</html>
